<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SA Birds Dashboard</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f2f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1310" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon-192.png?v=3">
  <style>
    /* Same colours and type as the app (styles.css), light and dark. */
    :root { --bg: #f2f2ec; --bg-elev: #fff; --fill: rgba(60, 72, 62, .08); --fill-2: rgba(60, 72, 62, .14);
      --label: #161a17; --label-2: rgba(22, 26, 23, .64); --label-3: rgba(22, 26, 23, .44);
      --tint: #d47a0b; --good: #23994a; --bad: #d63b2c; --data: #2f8f5b; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1310; --bg-elev: #172019; --fill: rgba(150, 175, 158, .13); --fill-2: rgba(150, 175, 158, .22);
        --label: #f2f4ef; --label-2: rgba(232, 238, 230, .66); --label-3: rgba(232, 238, 230, .44);
        --tint: #f2a93b; --good: #3cc46a; --bad: #ff6a56; --data: #7fcc9c; }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { font: -apple-system-body; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--label); line-height: 1.4;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 4px 0 2px; font-size: 1.65rem; letter-spacing: -.02em; }
    h2 { margin: 28px 0 10px; font-size: 1.1rem; }
    .sub { margin: 0 0 14px; color: var(--label-2); font-size: .88rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .controls button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; font: inherit; font-size: .88rem;
      font-weight: 600; color: var(--label); background: var(--fill); }
    .controls button[aria-pressed="true"] { color: #fff; background: var(--tint); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .tile { padding: 12px 14px; border-radius: 14px; background: var(--bg-elev); }
    .tile b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .tile span { color: var(--label-2); font-size: .8rem; }
    .tile small { display: block; color: var(--good); font-size: .75rem; font-weight: 600; }
    .card { padding: 14px; border-radius: 14px; background: var(--bg-elev); }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .chart h3 { margin: 0 0 8px; font-size: .9rem; font-weight: 600; }
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 110px; border-bottom: 1px solid var(--fill-2); }
    .bars i { flex: 1; min-width: 2px; background: var(--data); border-radius: 3px 3px 0 0; position: relative; }
    .bars i:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-size: .7rem; font-style: normal; padding: 2px 6px; border-radius: 6px; color: #fff; background: #222; }
    .axis { display: flex; justify-content: space-between; color: var(--label-3); font-size: .7rem; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    td, th { padding: 7px 4px; border-bottom: 1px solid var(--fill); text-align: left; vertical-align: middle; }
    th { color: var(--label-2); font-weight: 600; font-size: .78rem; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .bird { display: flex; align-items: center; gap: 8px; }
    .bird img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; background: var(--fill); }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .photo { overflow: hidden; border-radius: 14px; background: var(--bg-elev); }
    .photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
    .photo div { padding: 10px; }
    .photo p { margin: 0 0 8px; font-size: .8rem; color: var(--label-2); }
    .photo .actions { display: flex; gap: 8px; }
    .photo button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; }
    .keep { color: var(--good); background: color-mix(in srgb, var(--good) 16%, transparent); }
    .remove { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
    .photo.done { opacity: .45; }
    .empty, .msg { color: var(--label-2); font-size: .88rem; }
    .key { display: flex; gap: 8px; max-width: 420px; }
    .key input { flex: 1; min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; font: inherit; color: var(--label); background: var(--bg-elev); }
    .key button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; color: #fff; background: var(--tint); }
    /* Players */
    .sort { margin: 0 0 10px; }
    .players { display: grid; gap: 8px; }
    .player { display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: center; width: 100%;
      padding: 12px; border: 0; border-radius: 14px; font: inherit; text-align: left; color: var(--label); background: var(--bg-elev); cursor: pointer; }
    .player:active { opacity: .7; }
    .avatar { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--fill-2);
      display: grid; place-items: center; font-weight: 700; color: var(--label-2); }
    .player .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--label-2); font-size: .8rem; }
    .player .when { text-align: right; font-size: .8rem; color: var(--label-2); white-space: nowrap; }
    .player .when b { display: block; color: var(--label); font-size: .88rem; }
    .player .nums { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--label-2); }
    .player .nums b { color: var(--label); font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .7rem; font-weight: 600; color: var(--label-2); background: var(--fill); }
    /* Player detail */
    dialog { width: min(720px, 100%); max-height: calc(100% - 24px); margin: auto auto 0; padding: 0 16px 24px; border: 0;
      border-radius: 22px 22px 0 0; color: var(--label); background: var(--bg); }
    dialog::backdrop { background: rgba(0, 0, 0, .4); }
    .dhead { position: sticky; top: 0; display: flex; align-items: center; gap: 12px; padding: 16px 0 10px; background: var(--bg); z-index: 1; }
    .dhead .avatar { grid-row: auto; flex: none; }
    .dhead div { flex: 1; min-width: 0; }
    .dhead b { display: block; font-size: 1.15rem; }
    .dhead span { color: var(--label-2); font-size: .85rem; }
    .close { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; font-size: 1.1rem; color: var(--label); background: var(--fill); }
    .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin: 4px 0 8px; font-size: .85rem; }
    .facts div span { display: block; color: var(--label-2); font-size: .75rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips span { padding: 3px 10px; border-radius: 999px; font-size: .78rem; background: var(--bg-elev); }
    .chips span.m { color: var(--good); }
    .timeline { list-style: none; margin: 0; padding: 0; font-size: .85rem; }
    .timeline li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--fill); }
    .timeline time { flex: none; width: 92px; color: var(--label-2); font-size: .78rem; }
    details.history summary { cursor: pointer; color: var(--tint); font-weight: 600; margin: 14px 0 8px; }
    .hist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .hist div { overflow: hidden; border-radius: 12px; background: var(--bg-elev); font-size: .78rem; }
    .hist img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
    .hist p { margin: 6px 8px 8px; }
    .hist .kept { color: var(--good); font-weight: 600; } .hist .removed { color: var(--bad); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>SA Birds dashboard</h1>
    <p class="sub" id="updated">Private: only works with your key.</p>
    <form class="key" id="keyForm" hidden>
      <input id="keyInput" placeholder="Your private key" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit">Open</button>
    </form>
    <p class="msg" id="msg"></p>
    <div id="report" hidden>
      <div class="controls" id="envBtns">
        <button type="button" data-env="main" aria-pressed="true">Live app</button>
        <button type="button" data-env="dev">Dev</button>
      </div>
      <div class="controls" id="dayBtns">
        <button type="button" data-days="7">7 days</button>
        <button type="button" data-days="30" aria-pressed="true">30 days</button>
        <button type="button" data-days="90">90 days</button>
      </div>
      <h2>At a glance</h2>
      <div class="tiles" id="tiles"></div>

      <h2>Players <span id="playerCount"></span></h2>
      <div class="controls sort" id="sortBtns">
        <button type="button" data-sort="last_played" aria-pressed="true">Last played</button>
        <button type="button" data-sort="answers">Most answers</button>
        <button type="button" data-sort="mastered">Most mastered</button>
        <button type="button" data-sort="signed_up">Newest sign-ups</button>
      </div>
      <div class="players" id="players"></div>

      <h2>Over time</h2>
      <div class="grid2" id="charts"></div>

      <h2>What players do</h2>
      <div class="card"><table id="events"></table></div>

      <div class="grid2">
        <div><h2>Most-missed birds</h2><div class="card"><table id="missed"></table></div></div>
        <div><h2>Most common mix-ups</h2><div class="card"><table id="mixups"></table></div></div>
      </div>

      <h2>Flagged photos <span id="flagCount"></span></h2>
      <div class="photos" id="photos"></div>
      <details class="history" id="historyBox"><summary>Decisions so far</summary><div class="hist" id="history"></div></details>
    </div>
    <dialog id="playerDlg"></dialog>
  </main>
  <script>
    "use strict";
    // Reads public.admin_report / admin_photo_decide (Supabase); both refuse anything but a reviewer key.
    const RPC = "https://oenkcaswabrkqhvukcyb.supabase.co/rest/v1/rpc";
    const API_KEY = "sb_publishable_3n_rTfWAWYptlsWuCNqyUQ_x6emNOwB";  // public by design
    const KEY = "sabirds.adminKey.v1";
    const $ = (id) => document.getElementById(id);
    const EVENT_NAMES = { open: "App opened", answer: "Answers", hint: "Hints used", skip: "Birds skipped", undo_skip: "Skips undone",
      snooze: "Hidden for a day", batch: "New birds added", level_up: "Moved up a level", sign_in: "Signed in", sign_out: "Signed out",
      call_failed: "Calls that wouldn't play", flag_photo: "Photos flagged", compare: "Compare opened", offline_download: "Offline downloads" };
    let env = "main", days = 30, names = new Map(), players = [], sortBy = "last_played";

    const rpc = (name, body) => fetch(`${RPC}/${name}`, {
      method: "POST", headers: { apikey: API_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body),
    }).then(async (r) => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.status); return r.json(); });

    // A private link (?key=…) stores the key on this device and is removed from the address bar.
    const url = new URL(location.href);
    if (url.searchParams.get("key")) {
      try { localStorage.setItem(KEY, url.searchParams.get("key")); } catch { /* private mode */ }
      url.searchParams.delete("key");
      history.replaceState(null, "", url);
    }
    const key = () => { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } };

    const fmt = (n) => Number(n || 0).toLocaleString("en-ZA");
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const bird = (id) => names.get(id) || { name: `Bird ${id}` };

    function tiles(t) {
      const items = [["Google accounts", t.accounts, t.accounts_7d ? `+${t.accounts_7d} this week` : ""],
        ["Players (all)", t.players, ""], ["Active today", t.active_1d, ""], ["Active this week", t.active_7d, ""],
        ["Answers given", t.answers, ""], ["Birds mastered", t.mastered, "across all players"], ["Photos to review", t.flags_waiting, ""]];
      $("tiles").innerHTML = items.map(([l, n, s]) => `<div class="tile"><b>${fmt(n)}</b><span>${l}</span>${s ? `<small>${s}</small>` : ""}</div>`).join("");
    }

    // One bar per day over the chosen period (days with nothing show as empty).
    function chart(title, rows, { peak = false } = {}) {
      const by = new Map(rows.map((r) => [r.day, r.n]));
      const list = [];
      for (let i = days - 1; i >= 0; i--) {
        const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
        list.push([d, by.get(d) || 0]);
      }
      const max = Math.max(1, ...list.map((x) => x[1]));
      const total = list.reduce((a, x) => a + x[1], 0);
      const label = peak ? `busiest day ${fmt(Math.max(0, ...list.map((x) => x[1])))}` : fmt(total);
      return `<div class="card chart"><h3>${title} · ${label}</h3><div class="bars">${list.map(([d, n]) =>
        `<i style="height:${(n / max) * 100}%" data-tip="${d.slice(5)}: ${n}"></i>`).join("")}</div>
        <div class="axis"><span>${list[0][0].slice(5)}</span><span>today</span></div></div>`;
    }

    function render(r) {
      $("updated").textContent = `Updated ${new Date(r.generated).toLocaleString("en-ZA", { dateStyle: "medium", timeStyle: "short" })}`;
      tiles(r.totals);
      const answers = r.events_by_day.filter((e) => e.type === "answer");
      const opens = r.events_by_day.filter((e) => e.type === "open");
      $("charts").innerHTML = chart("Google sign-ups", r.signups_by_day) + chart("Active players", r.active_by_day, { peak: true })
        + chart("Answers", answers) + chart("App opens", opens);
      const ev = Object.entries(r.event_totals).sort((a, b) => b[1] - a[1]);
      $("events").innerHTML = ev.length
        ? `<tr><th>Action</th><th class="num">Last ${days} days</th></tr>` + ev.map(([t, n]) => `<tr><td>${esc(EVENT_NAMES[t] || t)}</td><td class="num">${fmt(n)}</td></tr>`).join("")
        : `<tr><td class="empty">No events yet — they start once players have the update.</td></tr>`;
      const birdCell = (id) => { const b = bird(id); return `<span class="bird">${b.img ? `<img src="${b.img}" alt="" loading="lazy">` : ""}${esc(b.name)}</span>`; };
      $("missed").innerHTML = `<tr><th>Bird</th><th class="num">Missed</th><th class="num">Tries</th></tr>` + r.most_missed.map((m) =>
        `<tr><td>${birdCell(m.id)}</td><td class="num">${Math.round(m.miss * 100)}%</td><td class="num">${fmt(m.tries)}</td></tr>`).join("");
      $("mixups").innerHTML = `<tr><th>Bird</th><th>Mistaken for</th><th class="num">Times</th></tr>` + r.top_mixups.map((m) =>
        `<tr><td>${esc(bird(m.id).name)}</td><td>${esc(bird(m.picked).name)}</td><td class="num">${fmt(m.n)}</td></tr>`).join("");
      $("flagCount").textContent = r.photos.length ? `(${r.photos.length})` : "";
      $("photos").innerHTML = r.photos.length ? r.photos.map((p) => `
        <div class="photo" data-id="${p.photo_id}">
          <img src="${esc(String(p.photo_url).replace("/large.", "/medium."))}" alt="" loading="lazy">
          <div><b>${esc(p.species_name)}</b>
            <p>Flagged ${p.reports > 1 ? `${p.reports} times` : "once"} · ${new Date(p.reported_at).toLocaleDateString("en-ZA")}</p>
            <div class="actions"><button class="keep" data-d="keep" type="button">Keep</button><button class="remove" data-d="remove" type="button">Remove</button></div>
          </div></div>`).join("")
        : `<p class="empty">Nothing to review. 🎉</p>`;
    }

    // "3 h ago", "yesterday", "12 Oct"
    function ago(t) {
      if (!t) return "—";
      const s = (Date.now() - new Date(t)) / 1000;
      if (s < 90) return "just now";
      if (s < 3600) return `${Math.round(s / 60)} min ago`;
      if (s < 86400) return `${Math.round(s / 3600)} h ago`;
      if (s < 172800) return "yesterday";
      if (s < 7 * 86400) return `${Math.floor(s / 86400)} days ago`;
      return new Date(t).toLocaleDateString("en-ZA", { day: "numeric", month: "short" });
    }
    const day = (t) => (t ? new Date(t).toLocaleString("en-ZA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—");
    const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : "—");
    const avatar = (p) => (p.picture ? `<img class="avatar" src="${esc(p.picture)}" alt="" referrerpolicy="no-referrer">`
      : `<span class="avatar">${esc((p.name || "G")[0].toUpperCase())}</span>`);
    const label = (p) => p.name || p.email || `Guest ${p.id.slice(0, 4)}`;

    function renderPlayers() {
      const key = (p) => (sortBy === "last_played" || sortBy === "signed_up" ? new Date(p[sortBy] || 0).getTime() : p[sortBy] || 0);
      const list = [...players].sort((a, b) => key(b) - key(a));
      $("playerCount").textContent = `(${players.length})`;
      $("players").innerHTML = list.map((p) => `
        <button class="player" type="button" data-id="${esc(p.id)}">
          ${avatar(p)}
          <span class="who"><b>${esc(label(p))}</b><span>${p.email ? esc(p.email) : "Not signed in"}${p.app === "dev" ? ' · <span class="pill">Dev</span>' : ""}</span></span>
          <span class="when"><b>${ago(p.last_played)}</b>${p.days_played} day${p.days_played === 1 ? "" : "s"} played</span>
          <span class="nums"><span><b>${fmt(p.answers)}</b> answers</span><span><b>${pct(p.right, p.answers)}</b> right</span>
            <span><b>${fmt(p.mastered)}</b> mastered</span><span><b>${fmt(p.learning)}</b> learning</span>
            ${p.hints ? `<span><b>${fmt(p.hints)}</b> hints</span>` : ""}${p.skips ? `<span><b>${fmt(p.skips)}</b> skips</span>` : ""}
            ${p.levels ? `<span class="pill">${esc(p.levels)}</span>` : ""}</span>
        </button>`).join("") || `<p class="empty">No players yet.</p>`;
    }

    const EVENT_VERBS = { open: "Opened the app", answer: "Answered", hint: "Used a hint", skip: "Skipped", undo_skip: "Undid a skip",
      snooze: "Hid for a day", batch: "New birds added", level_up: "Moved up a level", sign_in: "Signed in", sign_out: "Signed out",
      call_failed: "Call wouldn't play", flag_photo: "Flagged a photo", compare: "Compared", offline_download: "Downloaded for offline" };
    function eventText(e) {
      const b = e.id ? ` ${bird(e.id).name}` : "";
      const d = e.d || {};
      if (e.type === "answer") return `${d.r === "right" ? "✓ Got" : "✗ Missed"}${b}${d.hint ? " (with hint)" : ""}`;
      if (e.type === "batch") return `${d.n} new birds added`;
      if (e.type === "level_up") return `Moved up to ${d.level}${d.auto ? " (ticked automatically)" : ""}`;
      if (e.type === "compare") return `Compared${b} with ${bird(d.with).name}`;
      if (e.type === "open") return `Opened the app${d.levels ? ` · ${d.levels}` : ""}${d.offline ? " · offline" : ""}`;
      if (e.type === "offline_download") return `Downloaded ${d.birds} birds for offline`;
      return `${EVENT_VERBS[e.type] || e.type}${b}`;
    }

    async function openPlayer(id) {
      const p = players.find((x) => x.id === id);
      const dlg = $("playerDlg");
      dlg.innerHTML = `<div class="dhead">${avatar(p)}<div><b>${esc(label(p))}</b><span>${p.email ? esc(p.email) : "Not signed in"}</span></div>
        <button class="close" type="button" aria-label="Close">✕</button></div><p class="msg">Loading…</p>`;
      dlg.showModal();
      dlg.querySelector(".close").onclick = () => dlg.close();
      const d = await rpc("admin_player", { p_key: key(), p_id: id, p_env: env }).catch(() => null);
      if (!d) { dlg.querySelector(".msg").textContent = "Couldn't load this player."; return; }
      const mastered = d.birds.filter((x) => x.streak >= 3);
      const learning = d.birds.filter((x) => x.streak < 3).sort((a, b) => (b.wrong - b.right / 2) - (a.wrong - a.right / 2));
      const chip = (x, cls = "") => `<span class="${cls}">${esc(bird(x.id).name)} <small>${x.right}✓ ${x.wrong}✗</small></span>`;
      dlg.querySelector(".msg").outerHTML = `
        <div class="tiles">
          <div class="tile"><b>${fmt(p.answers)}</b><span>Answers · ${pct(p.right, p.answers)} right</span></div>
          <div class="tile"><b>${fmt(p.mastered)}</b><span>Mastered</span></div>
          <div class="tile"><b>${fmt(p.learning)}</b><span>Learning</span></div>
          <div class="tile"><b>${fmt(p.days_played)}</b><span>Days played</span></div>
        </div>
        <div class="facts">
          <div><span>Signed up</span>${day(p.signed_up)}</div><div><span>Last sign-in</span>${day(p.last_sign_in)}</div>
          <div><span>First played</span>${day(p.first_played)}</div><div><span>Last played</span>${day(p.last_played)}</div>
          <div><span>Levels</span>${esc(p.levels || "—")}</div><div><span>Cards</span>${esc(p.mode || "—")}</div>
          <div><span>App opens</span>${fmt(p.opens)}</div><div><span>Hints · skips</span>${fmt(p.hints)} · ${fmt(p.skips)}</div>
          <div><span>Hidden for a day</span>${fmt(p.snoozes)}</div><div><span>Level-ups</span>${fmt(p.level_ups)}</div>
          <div><span>Calls that failed</span>${fmt(p.call_failed)}</div><div><span>Photos hidden</span>${fmt(d.hidden_photos)}</div>
        </div>
        <h2>Finding hardest (${learning.length} learning)</h2>
        <div class="chips">${learning.slice(0, 40).map((x) => chip(x)).join("") || '<span class="empty">None</span>'}</div>
        <h2>Mastered (${mastered.length})</h2>
        <div class="chips">${mastered.map((x) => chip(x, "m")).join("") || '<span class="empty">None yet</span>'}</div>
        <h2>Mix-ups</h2>
        <div class="card"><table>${d.mixups.length ? `<tr><th>Bird</th><th>Mistaken for</th><th class="num">Times</th></tr>` + d.mixups.slice(0, 20).map((m) =>
          `<tr><td>${esc(bird(m.id).name)}</td><td>${esc(bird(m.picked).name)}</td><td class="num">${m.n}</td></tr>`).join("") : '<tr><td class="empty">None</td></tr>'}</table></div>
        <h2>Recent activity</h2>
        <ul class="timeline">${d.recent.map((e) => `<li><time>${day(e.at)}</time><span>${esc(eventText(e))}</span></li>`).join("")
          || '<li class="empty">No activity recorded yet (counts started on 23 Oct).</li>'}</ul>`;
    }

    async function loadHistory() {
      const h = await rpc("admin_photo_history", { p_key: key() }).catch(() => []);
      $("history").innerHTML = h.map((x) => `<div><img src="${esc(String(x.photo_url).replace("/large.", "/medium."))}" alt="" loading="lazy">
        <p><b>${esc(x.species_name)}</b><br><span class="${x.status}">${x.status === "kept" ? "Kept" : "Removed"}</span> · ${x.decided_at ? new Date(x.decided_at).toLocaleDateString("en-ZA") : ""}</p></div>`).join("")
        || '<p class="empty">No decisions yet.</p>';
    }

    async function load() {
      if (!key()) { $("keyForm").hidden = false; $("report").hidden = true; return; }
      $("msg").textContent = "Loading…";
      try {
        const [r, pl] = await Promise.all([rpc("admin_report", { p_key: key(), p_env: env, p_days: days }),
          rpc("admin_players", { p_key: key(), p_env: env })]);
        $("msg").textContent = "";
        $("keyForm").hidden = true;
        $("report").hidden = false;
        render(r);
        players = pl;
        renderPlayers();
        loadHistory();
      } catch (e) {
        $("msg").textContent = String(e.message).includes("not allowed") ? "That key isn't accepted." : "Couldn't load the dashboard. Check your connection.";
        if (String(e.message).includes("not allowed")) { try { localStorage.removeItem(KEY); } catch { /* */ } $("keyForm").hidden = false; }
      }
    }

    $("keyForm").addEventListener("submit", (e) => {
      e.preventDefault();
      try { localStorage.setItem(KEY, $("keyInput").value.trim()); } catch { /* */ }
      load();
    });
    $("envBtns").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      env = b.dataset.env;
      $("envBtns").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      load();
    });
    $("dayBtns").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      days = Number(b.dataset.days);
      $("dayBtns").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      load();
    });
    $("sortBtns").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      sortBy = b.dataset.sort;
      $("sortBtns").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      renderPlayers();
    });
    $("players").addEventListener("click", (e) => {
      const b = e.target.closest(".player"); if (b) openPlayer(b.dataset.id);
    });
    $("playerDlg").addEventListener("click", (e) => { if (e.target === $("playerDlg")) $("playerDlg").close(); });
    $("photos").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-d]"); if (!b) return;
      const card = b.closest(".photo");
      card.querySelectorAll("button").forEach((x) => { x.disabled = true; });
      const ok = await rpc("admin_photo_decide", { p_key: key(), p_photo_id: Number(card.dataset.id), p_decision: b.dataset.d }).catch(() => false);
      if (ok === true) {
        card.classList.add("done");
        card.querySelector(".actions").innerHTML = `<p>${b.dataset.d === "keep" ? "Kept" : "Removed"} — applies on every device next time the app opens.</p>`;
      } else {
        card.querySelectorAll("button").forEach((x) => { x.disabled = false; });
        card.querySelector("p").textContent = "Couldn't save that. Check your connection and try again.";
      }
    });

    // Bird names and thumbnails come from the app's own data file.
    fetch("data/species.json").then((r) => r.json()).then((list) => {
      for (const s of list) names.set(s.id, { name: s.name, img: s.photos[0] ? `${s.photos[0].base}/square.${s.photos[0].ext}` : "" });
    }).catch(() => {}).finally(load);
  </script>
</body>
</html>
