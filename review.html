<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photo Review</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f2f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1310" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    /* Same colours and type as the app (styles.css), light and dark. */
    :root { --bg: #f2f2ec; --bg-elev: #fff; --label: #161a17; --label-2: rgba(22, 26, 23, .64);
      --tint: #d47a0b; --good: #23994a; --bad: #d63b2c; --shadow: 0 10px 30px rgba(20, 30, 25, .14); color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1310; --bg-elev: #172019; --label: #f2f4ef; --label-2: rgba(232, 238, 230, .66);
        --tint: #f2a93b; --good: #3cc46a; --bad: #ff6a56; --shadow: 0 12px 34px rgba(0, 0, 0, .45); }
    }
    * { box-sizing: border-box; }
    html { font: -apple-system-body; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--label); line-height: 1.45;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
    main { max-width: 560px; margin: 0 auto; }
    .eyebrow { margin: 8px 0 0; font-size: .765rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--label-2); }
    h1 { margin: 2px 0 12px; font-size: 1.65rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
    p { margin: 12px 0; color: var(--label-2); font-size: .88rem; }
    img { display: block; width: 100%; min-height: 200px; border-radius: 16px; background: #000; object-fit: contain; box-shadow: var(--shadow); }
    .actions { display: flex; gap: 10px; margin-top: 16px; }
    button { flex: 1; min-height: 52px; border: 0; border-radius: 14px; font: inherit; font-weight: 600;
      -webkit-tap-highlight-color: transparent; transition: transform 160ms ease-out; }
    button:active { transform: scale(.97); }
    .keep { color: var(--good); background: color-mix(in srgb, var(--good) 16%, transparent); }
    .remove { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
    .keep.chosen { color: #fff; background: var(--good); }
    .remove.chosen { color: #fff; background: var(--bad); }
    a { color: var(--tint); font-weight: 600; text-decoration: none; }
    @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Flagged photo</p>
    <h1 id="title">Photo review</h1>
    <p id="msg">Loading…</p>
    <img id="photo" alt="" hidden>
    <div class="actions" id="actions" hidden>
      <button class="keep" id="keep" type="button">Keep photo</button>
      <button class="remove" id="remove" type="button">Remove photo</button>
    </div>
    <p><a href="./">Open SA Birds</a></p>
  </main>
  <script>
    "use strict";
    const URL_ = "https://oenkcaswabrkqhvukcyb.supabase.co/functions/v1/photo-review";
    const KEY = "sb_publishable_3n_rTfWAWYptlsWuCNqyUQ_x6emNOwB";
    const q = new URLSearchParams(location.search);
    const id = Number(q.get("id")), token = q.get("token") || "", suggested = q.get("decision");
    const $ = (x) => document.getElementById(x);
    const call = (body) => fetch(URL_, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ photo_id: id, token, ...body }) }).then((r) => r.json());
    const label = { pending: "waiting for your decision", kept: "kept in the app", removed: "removed from the app" };

    function show(review) {
      $("title").textContent = review.species_name || "Photo review";
      $("photo").src = review.photo_url;
      $("photo").hidden = false;
      $("msg").textContent = `This photo is ${label[review.status]}. Your choice applies on every device the next time the app opens.`;
      $("actions").hidden = false;
      $("keep").classList.toggle("chosen", suggested === "keep");
      $("remove").classList.toggle("chosen", suggested === "remove");
    }

    async function decide(decision) {
      $("msg").textContent = "Saving…";
      const r = await call({ action: "decide", decision }).catch(() => null);
      if (r?.ok) show(r.review);
      else $("msg").textContent = "Couldn't save that. Check your connection and try again.";
    }

    call({ action: "lookup" })
      .then((r) => (r.ok ? show(r.review) : ($("msg").textContent = "This review link isn't valid.")))
      .catch(() => { $("msg").textContent = "Couldn't load the photo. Check your connection."; });
    $("keep").addEventListener("click", () => decide("keep"));
    $("remove").addEventListener("click", () => decide("remove"));
  </script>
</body>
</html>
