<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logo mockups</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; padding: 24px 16px; font: 17px -apple-system, BlinkMacSystemFont, sans-serif; background: #f2f2ec; color: #161a17; }
    h1 { margin: 0 0 6px; font-size: 1.6rem; }
    p { margin: 0 0 18px; color: rgba(22,26,23,.64); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 520px; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: inherit; }
    .card img { width: 84px; height: 84px; border-radius: 19px; box-shadow: 0 4px 12px rgba(0,0,0,.15); margin-bottom: 6px; }
    .card span { font-size: .8rem; color: rgba(22,26,23,.64); text-align: center; }
  </style>
</head>
<body>
  <h1>SA Birds logo mockups</h1>
  <p>Open one, then tap Share → Add to Home Screen. Add a few to compare them on your real home screen.</p>
  <div class="grid"><a class="card" href="a/"><img src="a/icon.png" alt=""><b>Logo A</b><span>White + sun</span></a><a class="card" href="b/"><img src="b/icon.png" alt=""><b>Logo B</b><span>White, big bird</span></a><a class="card" href="c/"><img src="c/icon.png" alt=""><b>Logo C</b><span>Orange</span></a><a class="card" href="d/"><img src="d/icon.png" alt=""><b>Logo D</b><span>Cream + sun</span></a><a class="card" href="e/"><img src="e/icon.png" alt=""><b>Logo E</b><span>Sky blue + sun</span></a><a class="card" href="f/"><img src="f/icon.png" alt=""><b>Logo F</b><span>Current (dark)</span></a></div>
</body>
</html>
