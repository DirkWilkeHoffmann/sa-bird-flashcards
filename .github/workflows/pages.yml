# Publishes the app to GitHub Pages:
#   main branch -> https://dirkwilkehoffmann.github.io/sa-bird-flashcards/
#   dev branch  -> https://dirkwilkehoffmann.github.io/sa-bird-flashcards/dev/
#   tips branch -> https://dirkwilkehoffmann.github.io/sa-bird-flashcards/tips/
# GitHub only lets main publish to Pages, so a push to dev or tips just asks main to publish;
# main's run always includes the latest dev and tips branches under /dev/ and /tips/.
name: Publish to GitHub Pages

on:
  push:
    branches: [main, dev, tips]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ask-main-to-publish:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out dev (if it exists)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: dev

      - name: Check out tips (if it exists)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: tips
          path: tips

      - name: Put dev under /dev/ and tips under /tips/, each with its own name and icon
        run: |
          for env in dev tips; do
            [ -d "$env" ] || continue
            case $env in dev) label="Dev" ;; tips) label="Tips" ;; esac
            rm -rf "$env/.git" "site/$env"
            sed -i "s/\"name\": \"SA Bird Flashcards\"/\"name\": \"SA Birds $label\"/; s/\"short_name\": \"SA Birds\"/\"short_name\": \"Birds $label\"/" "$env/manifest.webmanifest"
            sed -i "s/content=\"SA Birds\"/content=\"Birds $label\"/; s/<title>SA Bird Flashcards<\/title>/<title>SA Birds $label<\/title>/" "$env/index.html"
            if [ -d "$env/icons/$env" ]; then cp "$env/icons/$env/"*.png "$env/icons/"; fi
            mv "$env" "site/$env"
          done
          rm -rf site/.git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
