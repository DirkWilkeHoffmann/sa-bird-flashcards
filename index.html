<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>SA Bird Flashcards</title>
  <meta name="description" content="Flashcards for learning the birds of Southern Africa">
  <meta name="theme-color" content="#1b2a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SA Birds">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <h1>SA Birds</h1>
    <button class="filters" id="openSettings" type="button" aria-label="Settings">
      <span id="filterSummary">All birds</span> <span aria-hidden="true">⚙</span>
    </button>
    <div class="score" id="score" aria-live="polite">0 / 0</div>
  </header>

  <main class="card" id="card">
    <section class="media" id="media">
      <div class="carousel" id="carousel" aria-label="Bird photos"></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="flag" id="flag" type="button" aria-label="Hide this photo" title="Hide this photo">⚑</button>
      <div class="sound" id="sound" hidden>
        <button class="play" id="play" type="button" aria-label="Play call">▶</button>
        <p id="soundType"></p>
        <button class="other" id="otherCall" type="button">Another recording</button>
      </div>
    </section>
    <audio id="audio" preload="none"></audio>

    <section class="info" id="info" hidden>
      <h2 id="name"></h2>
      <p class="sci" id="sci"></p>
      <p class="family" id="family"></p>
      <div class="tags" id="tags"></div>
      <button class="btn ghost small" id="hearCall" type="button" hidden>▶ Hear call</button>
      <div id="details"></div>
      <p class="credits" id="credits"></p>
    </section>

    <div class="choices" id="choices" hidden></div>

    <div class="actions" id="ask">
      <button class="btn ghost" id="hint" type="button">Hint</button>
      <button class="btn primary" id="reveal" type="button">Reveal</button>
    </div>
    <div class="actions" id="grade" hidden>
      <button class="btn bad" id="missed" type="button">Missed it</button>
      <button class="btn good" id="gotIt" type="button">Got it</button>
    </div>
    <div class="actions" id="after" hidden>
      <button class="btn primary" id="next" type="button">Next bird</button>
    </div>
  </main>

  <dialog class="sheet" id="settings">
    <form method="dialog">
      <h2>Study set</h2>
      <fieldset>
        <legend>Cards</legend>
        <div class="chips" id="modeChips">
          <label><input type="radio" name="mode" value="mixed"> Mixed</label>
          <label><input type="radio" name="mode" value="photo"> Photos</label>
          <label><input type="radio" name="mode" value="call"> Calls</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Level</legend>
        <div class="chips" id="levelChips">
          <label><input type="checkbox" name="level" value="easy"> Easy</label>
          <label><input type="checkbox" name="level" value="medium"> Medium</label>
          <label><input type="checkbox" name="level" value="hard"> Hard</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Where</legend>
        <select class="select" id="areaSelect" name="area" aria-label="Area"></select>
      </fieldset>
      <fieldset>
        <legend>Seen in</legend>
        <div class="chips" id="countryChips"></div>
      </fieldset>
      <p class="count" id="setCount"></p>
      <button class="btn primary" type="submit">Done</button>
    </form>
  </dialog>

  <dialog class="sheet compare" id="compare">
    <form method="dialog">
      <h2>Compare</h2>
      <div class="compare-body" id="compareBody"></div>
      <p class="note">Tap a photo to see another one.</p>
      <button class="btn primary" type="submit">Close</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
